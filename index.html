<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>SvS Capital — HQ slot reservations</title>
<style>
  :root{--bg:#14161a;--panel:#1d2026;--line:#33383f;--fg:#e8eaee;--dim:#9aa2ad;
        --r20:#4ade80;--r24:#a3e635;--r28:#38bdf8;--r32:#818cf8;--taken:#fb923c;--bad:#f87171;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;
    background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0 8px 0 0;font-weight:650}
  .pill{font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
  .spacer{flex:1}
  main{display:flex;height:calc(100% - 54px);min-height:0}
  #wrap{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:10px;bottom:10px;font-size:12.5px;color:var(--dim);
    background:#000a;border:1px solid var(--line);border-radius:8px;padding:6px 9px;pointer-events:none}
  aside{width:320px;flex:none;border-left:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;min-height:0}
  aside .stats{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}
  .padbar{padding:9px 12px 10px;border-bottom:1px solid var(--line)}
  .padlbl{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px;letter-spacing:.02em}
  .padbtns{display:flex;gap:6px}
  .padbtns button{width:38px;padding:6px 0;text-align:center;font-variant-numeric:tabular-nums}
  .padhint{margin-top:6px;font-size:12px;color:var(--dim);line-height:1.45}
  aside .btns{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
  #list{list-style:none;margin:0;padding:6px 0 40px;overflow:auto;flex:1}
  #list li{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid #262a30;font-size:13.5px}
  #list li b{color:var(--taken);font-weight:600}
  #list li span.c{color:var(--dim);font-variant-numeric:tabular-nums}
  button{font:inherit;font-size:13px;color:var(--fg);background:#2a2f37;border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;cursor:pointer}
  button:hover{background:#333a44}
  button.on{background:#2f6b46;border-color:#3f8a5b}
  button.primary{background:#2f6b46;border-color:#3f8a5b;font-weight:600}
  button.danger{background:#5a2626;border-color:#8a3f3f}
  .modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;
    padding:14px;z-index:20}
  .modal.hidden{display:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;width:min(460px,100%)}
  .card h2{margin:0 0 4px;font-size:17px}
  .card .meta{color:var(--dim);font-size:13px;margin-bottom:10px;font-variant-numeric:tabular-nums}
  .card label{display:block;font-size:13px;color:var(--dim);margin:8px 0 4px}
  .card input,.card textarea{width:100%;background:#12141a;color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:9px;font:inherit}
  .card textarea{height:150px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .card .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .warn{color:var(--bad);font-size:13px;min-height:17px;margin-top:6px}
  .ok{color:var(--r20)}
  #legend{position:absolute;right:10px;top:10px;background:#000a;border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;font-size:12px;color:var(--dim);line-height:1.5}
  #legend i{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:5px;vertical-align:middle}
  @media(max-width:820px){
    main{flex-direction:column;height:auto}
    #wrap{height:58vh}
    aside{width:auto;border-left:none;border-top:1px solid var(--line);max-height:42vh}
  }
</style>
</head>
<body>
<header>
  <h1>SvS Capital — HQ slots</h1>
  <span class="pill" id="pillFree">–</span>
  <span class="pill" id="pillTaken">–</span>
  <span class="pill" id="pillShared">shared: connecting…</span>
  <span class="spacer"></span>
  <button id="btnSync" title="pull the latest list from the shared sign-up sheet">⟳ sync</button>
  <button id="btnGrid" title="show/hide the tile grid">grid</button>
  <button id="btnNames" title="show/hide the names on the map">names</button>
  <button id="btnFlip" title="flip N/S if the map looks mirrored compared to the game">flip N/S</button>
  <button id="btnTest" title="highlight the tiles to verify in game">verify tiles</button>
  <button id="btnFit">fit</button>
</header>

<main>
  <div id="wrap">
    <canvas id="map"></canvas>
    <div id="legend">
      <i style="background:var(--r20)"></i>inner ring (closest to capital)<br>
      <i style="background:var(--r24)"></i>ring 24 &nbsp; <i style="background:var(--r28)"></i>ring 28<br>
      <i style="background:var(--r32)"></i>ring 32 &nbsp; <i style="background:var(--taken)"></i>reserved
    </div>
    <div id="hint">tap a dot to reserve · drag to pan · wheel / pinch to zoom</div>
  </div>
  <aside>
    <div class="padbar">
      <span class="padlbl">space between HQs</span>
      <span id="padBtns" class="padbtns"></span>
      <div class="padhint" id="padHint"></div>
    </div>
    <div class="stats" id="stats">reservations are stored in this browser</div>
    <div class="btns">
      <button id="btnExport">export JSON</button>
      <button id="btnCopy">copy list</button>
      <button id="btnImport">import</button>
      <button id="btnHelp">how to share</button>
      <button id="btnReset" class="danger">reset</button>
    </div>
    <ol id="list"></ol>
  </aside>
</main>

<!-- reserve / release card -->
<div class="modal hidden" id="sheet">
  <div class="card">
    <h2 id="shTitle">Spot</h2>
    <div class="meta" id="shMeta"></div>
    <label for="shName">Your name / alliance tag</label>
    <input id="shName" maxlength="28" placeholder="e.g. Ahmed [Tj]">
    <div class="warn" id="shWarn"></div>
    <div class="row">
      <button class="primary" id="shTake">reserve this spot</button>
      <button class="danger hidden" id="shRelease">release</button>
      <button id="shCopy">copy X/Y</button>
      <button id="shClose">close</button>
    </div>
  </div>
</div>

<!-- import / export / help card -->
<div class="modal hidden" id="io">
  <div class="card">
    <h2 id="ioTitle">Import</h2>
    <div class="meta" id="ioMeta"></div>
    <textarea id="ioText" spellcheck="false"></textarea>
    <div class="row">
      <button class="primary" id="ioDo">import</button>
      <button id="ioClose">close</button>
    </div>
  </div>
</div>

  /* ---------- packing the band for any spacing ----------

      // show that, so generated lists keep to whole-coordinate tiles only.
      if (wholeOnly && (j % 2 !== 0)) continue;
      for (let i = -hi-1; i <= hi+1; i++){
        const d = hexDist([i,j], [0,0]);
        if (d >= lo && d <= hi) out.push([i,j]);

  const OFFS_CACHE = {};

      for (let i = -span; i <= span; i++){

  function mulberry32(a){                           // small deterministic PRNG (same idea as the seed in plan_hq.py)

      for (const t of order) if (!blocked.has(key(t))) put(t);
      return cur;

      for (let i = a.length - 1; i > 0; i--){
        const j = Math.floor(rnd() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;

    for (let it = 0; it < 40; it++){
      const seeds = best.filter(() => rnd() < 0.85);
      const seedKeys = new Set(seeds.map(key));
      keep(topUp(seeds, shuffle(tiles.filter(t => !seedKeys.has(key(t))))));
    }
    // 2c) climb: reseed from the current best and keep every improvement (drops 15% now and then for diversity)
    for (let it = 0; it < 800; it++){
      const seeds = (it % 4 === 3) ? res.filter(() => rnd() < 0.85) : res;

    const ang = (Math.atan2(x-CENTER.x, -(y-CENTER.y)) * 180/Math.PI + 360) % 360;

  // ---- sharing format: "# comment" or "<spotNumber> <name>" lines, or JSON ----
  function formatShare(res){
    const lines = ["# SvS HQ picks — " + Object.keys(res).length + " spot(s)"];
    Object.keys(res).map(Number).sort((a,b)=>a-b).forEach(n => lines.push(n + " " + res[n].name));

  function parseShare(text){
    const out = [];
    const t = (text||"").trim();
    if (!t) return out;
    if (t[0] === "{"){
      let j = null;
      try { j = JSON.parse(t); } catch(e){ return out; }
      const src = j.spots || j;
      for (const k of Object.keys(src)){
        const v = src[k];
        if (typeof v === "string") out.push({n:Number(k), name:v});
        else if (v && typeof v.name === "string") out.push({n:Number(k), name:v.name});
      }
      return out.filter(o => o.n > 0 && o.name);
    }
    for (const raw of t.split(/\r?\n/)){
      const line = raw.replace(/^\s*#.*$/, "").trim();
      if (!line) continue;
      const m = line.match(/^(\d{1,4})\s*[\s:,\-–—]+\s*(.+?)\s*$/);
      if (m) out.push({n:Number(m[1]), name:m[2]});
    }
    return out;

  function fitView(w, h, pad){
    pad = pad || 24;
    const spanX = OUTER_R*2 + 2, spanY = (OUTER_R*2 + 2)*SQUASH;
    const scale = Math.min((w-pad*2)/spanX, (h-pad*2)/spanY);
    return {scale, ox:w/2, oy:h/2, flip:1};

})();
if (typeof globalThis !== "undefined") globalThis.HQCore = HQCore;

/* ================================== UI ================================== */
function initUI(){
  const C = HQCore;
  const KEY = "hqmap.reservations.v1", NAMEKEY = "hqmap.myname";
  // ---- shared sign-up sheet (public JSON store, no account; anyone with the page can edit) ----
  const BACKEND = "https://store.zapier.com/api/records?secret=2e3f3b9d-2a24-48b7-81ee-46a917ef38f0";
  const $ = id => document.getElementById(id);
  const cv = $("map"), ctx = cv.getContext("2d");

  // reservations are keyed by the shared-sheet key ("p<pad>n<spot>") — every spacing has its own list
  let res = {};                                   // { "p1n12": {name, ts} }

  const saveRes = () => { try { localStorage.setItem(KEY, JSON.stringify(res)); } catch(e){} };

  /* ---------- spacing between HQs ---------- */
  const PADKEY = "hqmap.spacing", PADS = [0,1,2,3];

    const a = /^p(\d+)n(\d+)$/.exec(k); if (a) return [Number(a[1]), Number(a[2])];
    const b = /^s(\d+)$/.exec(k);       if (b) return [1, Number(b[1])];   // older keys
    return null;
  };

  try {
    const u = (location.search.match(/[?&]pad=(\d+)/) || [])[1];

  } catch(e){}
  if (PADS.indexOf(pad) < 0) pad = 1;

  const resFor = p => {
    const o = {}, list = C.spots(p);
    for (const k of Object.keys(res)){

  let view = {scale:12, ox:0, oy:0, flip:-1};     // flip -1: in game +Y goes DOWN the screen
  let showGrid = true, showNames = true, showTest = false;

  /* ---------- rendering ---------- */
  function resize(){

    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);

  function fit(){ const v = C.fitView(W, H); v.flip = view.flip; view = v; draw(); }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#191c21"; ctx.fillRect(0,0,W,H);

    // outer zone
    poly(C.zonePoly(C.OUTER_R, view), "#3a2f21", "#c4a46a", 3);
    // inner no-build zone
    poly(C.zonePoly(C.INNER_R, view), "#5c2727", "#d96060", 2.5);

    // tile grid
    if (showGrid && view.scale > 5){
      ctx.strokeStyle = "#2f3339"; ctx.lineWidth = 1;
      const R = C.OUTER_R;
      for (let j=-R-1; j<=R+1; j++){
        for (let i=-R-1; i<=R+1; i++){

          for (let k=1;k<6;k++) ctx.lineTo(p[k][0],p[k][1]);
          ctx.closePath(); ctx.stroke();

      }
    }

    // capital marker
    const cp = C.toPx(C.CENTER.x, C.CENTER.y, view);

    ctx.beginPath(); ctx.arc(cp[0], cp[1], Math.max(3, view.scale*0.45), 0, 7); ctx.fill();
    if (view.scale > 7){
      ctx.fillStyle = "#e8e2d0"; ctx.font = "600 12px system-ui";
      ctx.textAlign = "center"; ctx.fillText("CAPITAL", cp[0], cp[1] - view.scale*0.8);
      ctx.textAlign = "left";
    }

    // spots
    for (const s of spots){
      const p = C.toPx(s.X, s.Y, view);
      if (p[0] < -30 || p[1] < -30 || p[0] > W+30 || p[1] > H+30) continue;
      const taken = resAt(s.n);
      const r = Math.max(4, view.scale*0.32);
      if (taken){
        ctx.fillStyle = "#fb923c"; ctx.strokeStyle = "#fff7ed"; ctx.lineWidth = 1.5;
      } else {
        ctx.fillStyle = C.RING_COLOR[s.ring] || "#4ade80"; ctx.strokeStyle = "#0b0d10"; ctx.lineWidth = 1;
      }
      ctx.beginPath(); ctx.arc(p[0], p[1], taken ? r*1.15 : r, 0, 7); ctx.fill(); ctx.stroke();
      if (showNames && taken && view.scale > 7){
        label(p[0], p[1] - r*1.5, taken.name, "#fb923c");
      } else if (view.scale > 22){
        ctx.fillStyle = "#c9ced6"; ctx.font = "10px system-ui"; ctx.textAlign = "center";
        ctx.fillText(s.n, p[0], p[1] + 3.5); ctx.textAlign = "left";
      }
      if (sel === s){ ring(p[0], p[1], r + 5, "#fff"); }
      else if (hover === s){ ring(p[0], p[1], r + 4, "#ffffff88"); }
    }

    // verification tiles
    if (showTest){
      for (const t of C.TEST_TILES){
        const p = C.toPx(t.X, t.Y, view);
        const col = t.ok === false ? "#f87171" : (t.ok === true ? "#4ade80" : "#e879f9");
        ring(p[0], p[1], Math.max(9, view.scale*0.62), col);
        if (view.scale > 6){
          ctx.fillStyle = col; ctx.font = "11px system-ui"; ctx.textAlign = "center";

  function poly(pts, fill, stroke, lw){
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();

    if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }

  function ring(x, y, r, col){

  }
  function label(cx, cy, text, col){
    ctx.font = "600 11px system-ui"; ctx.textAlign = "center";

  /* ---------- interaction ---------- */
  let ptrs = new Map(), dragging = false, moved = 0, pinch = 0, last = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };

  /* ---------- reserve sheet ---------- */

  function openIO(mode){
    const help = mode === "help";
    $("ioTitle").textContent = help ? "How to share" : "Import reservations";
    $("ioMeta").textContent = help
      ? "This page keeps reservations in the browser that opens it. To collect everyone's picks:"
      : "Paste an export (JSON) or lines like \"12 Ahmed\". Existing spots not in the paste are kept.";
    $("ioText").value = help
      ? "Spacing: \"space between HQs\" (buttons on the right / bottom) sets how many EMPTY tiles\n" +
        "sit between two HQ footprints. 0 = the 7-tile footprints touch edge-to-edge; 1 = one empty\n" +

        "Shared sign-up sheet: this page writes every reservation straight to a public JSON store\n" +

        "as soon as the connection comes back.\n\n" +

    $("io").classList.remove("hidden");
  }

    const items = C.parseShare($("ioText").value);
    if (!items.length){ alert("nothing recognised — paste the export or lines like \"12 Ahmed\""); return; }
    let n = 0;
    for (const it of items){
      if (!spots.some(s => s.n === it.n)) continue;
      const op = {op:"set", p:pad, n:it.n, name:it.name};
      pending = pending.filter(q => !(q.p === pad && q.n === it.n));

  $("sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };
  $("io").onclick = e => { if (e.target.id === "io") $("io").classList.add("hidden"); };

  function flash(msg){
    const el = $("stats"); const old = el.textContent;
    el.textContent = msg; setTimeout(()=>{ el.textContent = old; }, 2500);
  }

  /* ---------- panel ---------- */

    $("pillTaken").textContent = nums.length + " reserved";
    $("stats").textContent = nums.length
      ? "reserved: " + nums.length + " · spacing " + pad + " · same list for everyone"
      : "no reservations yet at spacing " + pad + " — tap a dot on the map";

                     "<span class='spacer'></span><span class='c'>r" + s.ring + " " + s.clock + ":00</span>";

      ? "0 = footprints touch edge-to-edge · " + spots.length + " spots (rings " + C.bandFor(0)[0] + "–" + C.bandFor(0)[1] + ")"
      : pad === 1
      ? "1 = one empty tile between HQs · " + spots.length + " spots (rings " + C.bandFor(1)[0] + "–" + C.bandFor(1)[1] + ") — one tile of buffer"
      : pad + " = " + pad + " empty tiles between HQs · " + spots.length + " spots (rings " +

  }

  /* ---------- shared sign-up sheet ---------- */
  async function pull(){

        const pk = parseKey(k);
        const name = String(obj[k] == null ? "" : obj[k]).trim();

        const [op2, n] = pk;
        if (op2 < 0 || op2 > 6 || !C.spots(op2).some(s => s.n === n)) continue;
        fresh[k] = {name, ts: (res[k] && res[k].name === name) ? res[k].ts : Date.now()};
        remoteKeys.add(k);

  /* ---------- buttons ---------- */
  $("btnGrid").onclick  = e => { showGrid  = !showGrid;  e.target.classList.toggle("on", showGrid);  draw(); };
  $("btnNames").onclick = e => { showNames = !showNames; e.target.classList.toggle("on", showNames); draw(); };
  $("btnTest").onclick  = e => { showTest  = !showTest;  e.target.classList.toggle("on", showTest);  draw(); };
  $("btnFlip").onclick  = e => { view.flip = -view.flip; e.target.classList.toggle("on", view.flip<0); draw(); };
  $("btnFit").onclick   = () => fit();
  window.addEventListener("resize", resize);
  async function loadRemote(){
    const m = location.search.match(/[?&]load=([^&]+)/); if (!m) return;
    try {
      const r = await fetch(decodeURIComponent(m[1]), {cache:"no-store"});
      const txt = await r.text();
      const items = C.parseShare(txt);
      let n = 0;
      for (const it of items) if (spots.some(s => s.n === it.n)){ res[rkey(it.n, pad)] = {name:it.name, ts:Date.now()}; n++; }
      if (n){ saveRes(); refresh(); flash("loaded " + n + " shared reservation(s)"); }
    } catch(e){ flash("could not load shared list"); }
  }

  $("btnGrid").classList.add("on"); $("btnNames").classList.add("on");
  $("btnFlip").classList.toggle("on", view.flip < 0);
  $("btnSync").onclick = () => { pull(); flash("syncing with the shared sheet…"); };
  resize(); fit(); refresh(); startPolling(); loadRemote();
  // small debug hook (console): HQTest.sheet(12) opens spot 12, HQTest.state() shows what the page holds
  globalThis.HQTest = { sheet: openSheet, setPad, spots: () => spots,
                        state: () => ({ res, pending, sharedState, view, pad, spots: spots.length, remote: [...remoteKeys] }),
                        pull, flush, core: C };
}
if (typeof document !== "undefined" && document.getElementById && document.getElementById("map")) initUI();
</script>
</body>
</html>
