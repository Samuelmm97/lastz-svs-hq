<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>State 798 · Capital placement plan</title>
<style>
:root{color-scheme:dark;--bg:#111820;--panel:#1b2630;--line:#354552;--text:#eef3f4;--muted:#aec1c9;--accent:#7ad7c0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
header{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}a{color:var(--accent)}header a{margin-left:auto}
main{display:grid;grid-template-columns:minmax(0,1fr) 370px;height:calc(100vh - 65px)}.map{position:relative;min-width:0}canvas{width:100%;height:100%;display:block;touch-action:none}
.legend{position:absolute;left:12px;bottom:12px;background:#111b22e8;padding:9px 12px;border:1px solid var(--line);border-radius:8px}.legend span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}aside>div{padding:14px;border-bottom:1px solid var(--line)}
label{display:block;color:var(--muted);font-size:12px;margin-top:8px}input,select{width:100%;background:#111820;color:var(--text);border:1px solid var(--line);padding:8px;border-radius:6px;font:inherit}.stats{color:var(--muted);font-size:12px}.selected{min-height:70px}.selected strong{color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:var(--muted);position:sticky;top:0;background:var(--panel)}td,th{padding:6px;border-bottom:1px solid var(--line)}tr{cursor:pointer}tr:hover{background:#31414b}.rows{overflow:auto;flex:1}small{color:var(--muted)}
@media(max-width:800px){main{display:flex;flex-direction:column;height:auto}.map{height:55vh}aside{height:65vh;border-left:0;border-top:1px solid var(--line)}header a{margin-left:0}}
</style>
</head>
<body>
<header><h1>State 798 · Capital placement plan</h1><a href="index.html">HQ reservations</a><a href="placement-plan.csv" download>Download all 2,000 placements (CSV)</a></header>
<main><div class="map"><canvas id="map" aria-label="Proposed mud and grass HQ placements"></canvas><div class="legend"><div><span style="background:#efb86b"></span>Mud <span style="background:#7ad7c0;margin-left:12px"></span>Capital-area player <span style="background:#abb0f5;margin-left:12px"></span>Outside-area proxy <span style="background:#ef6f77;margin-left:12px"></span>Previously unshielded</div><small>Click a dot or player row · wheel to zoom · drag to pan</small></div></div>
<aside><div><strong id="summary">Loading plan…</strong><p class="stats" id="explain"></p><label for="search">Find player or alliance</label><input id="search" placeholder="Name or tag"><label for="section">Alliance section</label><select id="section"><option value="">All sections</option></select><label for="zone">Terrain</label><select id="zone"><option value="">Mud and grass</option><option value="mud">Mud</option><option value="grass">Grass</option></select></div><div class="selected" id="selected">Select a placement for coordinates.</div><div class="rows"><table><thead><tr><th>HQ</th><th>Player</th><th>Alliance</th><th>X, Y</th></tr></thead><tbody id="rows"></tbody></table></div></aside></main>
<script>
const $=id=>document.getElementById(id), canvas=$('map'),ctx=canvas.getContext('2d');
let plan,visible=[],selected=null,scale=1,panX=0,panY=0,drag=null;
const palette={mud:'#efb86b',grass:'#7ad7c0',outside:'#abb0f5',risk:'#ef6f77'};
function size(){const r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}
function project(p){const r=canvas.getBoundingClientRect(),base=Math.min(r.width/260,r.height/250)*scale;return [r.width/2+panX+(p.x-500)*base,r.height/2+panY+(p.y-500)*base*.8]}
function draw(){if(!plan)return;const r=canvas.getBoundingClientRect();ctx.fillStyle='#131e25';ctx.fillRect(0,0,r.width,r.height);
  for(const [rad,color] of [[120,'#355944'],[35,'#6b5036'],[18,'#7b3d3d']]){ctx.beginPath();const vertices=[[1,0],[.5,1],[-.5,1],[-1,0],[-.5,-1],[.5,-1]];for(let k=0;k<6;k++){const [x,y]=project({x:500+rad*vertices[k][0],y:500+rad*vertices[k][1]});if(k)ctx.lineTo(x,y);else ctx.moveTo(x,y)}ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#aebbc088';ctx.stroke()}
  for(const p of visible){const [x,y]=project(p);ctx.beginPath();ctx.arc(x,y,p===selected?5:Math.max(2,2.5*scale**.3),0,Math.PI*2);ctx.fillStyle=p.highRisk?palette.risk:p.attendanceProxy==='outside_capital_area'?palette.outside:palette[p.zone];ctx.fill()}
  if(selected){const [x,y]=project(selected);ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}}
function filters(){if(!plan)return;const q=$('search').value.toLocaleLowerCase(),section=$('section').value,zone=$('zone').value;visible=plan.placements.filter(p=>(!q||(p.name+' '+p.tag).toLocaleLowerCase().includes(q))&&(!section||p.section===section)&&(!zone||p.zone===zone));
  $('summary').textContent=`${visible.length.toLocaleString()} of ${plan.placements.length.toLocaleString()} players shown`;
  const body=$('rows');body.replaceChildren();for(const p of visible.slice(0,400)){const tr=document.createElement('tr');for(const value of [p.hq,p.name,p.tag||'—',`${p.x}, ${p.y}`]){const td=document.createElement('td');td.textContent=value;tr.append(td)}tr.onclick=()=>select(p);body.append(tr)}draw()}
function select(p){selected=p;$('selected').replaceChildren();const title=document.createElement('strong');title.textContent=`${p.name} · HQ ${p.hq} · ${p.tag||'No tag'}`;const detail=document.createElement('div');detail.textContent=`${p.zone.toUpperCase()} · X ${p.x}, Y ${p.y} · ring ${p.ring}${p.spot?' · reservation spot #'+p.spot:''}`;const note=document.createElement('small');note.textContent=`Last shield scan: ${p.shield.replaceAll('_',' ')}. Prior location: ${p.oldX}, ${p.oldY} (${p.attendanceProxy==='inside_capital_area'?'inside capital area':'outside capital area; attendance unverified'}).${p.highRisk?' Placed last in grass.':''} `;const source=document.createElement('a');source.href=`https://samuelmm97.github.io/last-z-state-798-map/#hq-${p.id}`;source.target='_blank';source.rel='noopener';source.textContent='Open atlas record';note.append(source);$('selected').append(title,detail,note);draw()}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,moved:false}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;panX+=dx;panY+=dy;drag.x=e.clientX;drag.y=e.clientY;draw()});
canvas.addEventListener('pointerup',e=>{if(!drag)return;const moved=drag.moved;drag=null;if(moved)return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;let best=null,d=12;for(const p of visible){const [px,py]=project(p),pd=Math.hypot(px-x,py-y);if(pd<d){d=pd;best=p}}if(best)select(best)});
canvas.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.5,Math.min(8,scale*(e.deltaY<0?1.12:.89)));draw()},{passive:false});
for(const id of ['search','section','zone'])$(id).addEventListener(id==='search'?'input':'change',filters);
fetch('placement-plan.json').then(r=>{if(!r.ok)throw Error('Plan could not be loaded');return r.json()}).then(data=>{plan=data;for(const tag of Object.keys(data.sections)){const option=document.createElement('option');option.value=tag;option.textContent=`${tag} (${data.sections[tag].players})`;$('section').append(option)}$('explain').textContent=`${data.meta.mudSpots} mud slots, ${data.meta.grassSpots} grass slots. Higher HQ levels lead each priority group. Prior capital-area players go first, outside-area players follow, then previously unshielded players. Location is only an attendance proxy. Known top alliances have angular sections. Grass spans ring 37–${data.meta.grassOuterRing-1}, with at least ${data.meta.grassMinDistance} tiles between HQ centers.`;filters();size()}).catch(e=>{$('summary').textContent=e.message});
new ResizeObserver(size).observe(canvas);
</script>
</body></html>
